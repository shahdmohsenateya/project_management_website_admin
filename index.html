<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Month 6 Crisis: Scoreboard</title>
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#10203A;--mut:#566178;--line:#CBD3E0;--teal:#0B8A93;--org:#E07B1A;--red:#C93636;--ok:#15845A;--grid:#D9DFEA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1628;--card:#13243D;--ink:#EEF2F8;--mut:#9DAAC0;--line:#27395A;--teal:#4FC3C9;--org:#F29B4B;--red:#F26B6B;--ok:#47CB8C;--grid:#142640}}
:root[data-theme="dark"]{--bg:#0B1628;--card:#13243D;--ink:#EEF2F8;--mut:#9DAAC0;--line:#27395A;--teal:#4FC3C9;--org:#F29B4B;--red:#F26B6B;--ok:#47CB8C;--grid:#142640}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:clamp(26px,7vw,38px);line-height:1.05;margin:0 0 10px;font-weight:900;letter-spacing:-.02em}
.card{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:16px;margin:12px 0;box-shadow:4px 4px 0 var(--ink)}
textarea{font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;width:100%;min-height:150px;padding:12px;border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:8px}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--org);color:#10203A;padding:12px 16px;border-radius:6px;cursor:pointer;flex:1}
.btn.sec{background:transparent;color:var(--ink);flex:0 0 auto}
.big{font-size:clamp(40px,12vw,72px);font-weight:900;line-height:1;margin:6px 0;overflow-wrap:anywhere}
.mut{color:var(--mut);font-size:14px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.st b{display:block;font-size:26px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
th{border-top:0;font-size:13px;color:var(--mut)}
tr.top td{font-weight:700}
.bad{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--red);overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style></head>
<body><div class="wrap">
<div class="card"><h1>Scoreboard</h1>
<p>Scores arrive live once Supabase is connected. You can also paste result codes, one per line. Codes are checked, ranked by score, and ties go to the fastest time.</p><p class="mut" id="st"></p>
<textarea id="in" placeholder="Nour|1450|11|98|7KQ2M" spellcheck="false"></textarea>
<div class="btns"><button class="btn" id="go">Rank scores</button><button class="btn sec" id="cl">Clear</button></div>
<p class="mut">Everything stays in this browser. Nothing is uploaded.</p></div>
<div id="out"></div></div>
<script>
const SB_URL = "https://pqrptqnbkenttgjwwwlu.supabase.co", SB_KEY = "sb_publishable_WVhN2SpWJF1MGzslj_ZDhA_yiRUy9q1";
const sbh=()=>{const h={apikey:SB_KEY};if(SB_KEY.startsWith("eyJ"))h.Authorization="Bearer "+SB_KEY;return h};
let LIVE="";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ck(s){let h=5381;for(const c of "m6|"+s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().slice(-5)}
function run(){
const own=$("#in").value;try{localStorage.setItem("m6codes",own)}catch(e){}const raw=own+"\n"+LIVE;
const seen=new Set(),good=[],bad=[];
raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
if(seen.has(l))return;seen.add(l);
const p=l.split("|"),[n,s,k,t,c]=p;
const v=p.length===5&&n&&/^\d+$/.test(s)&&/^\d+$/.test(k)&&/^\d+$/.test(t)&&+k<=12&&+s>=100*k&&+s<=200*k&&ck([n,s,k,t].join("|"))===c.toUpperCase();
if(v)good.push({n,s:+s,k:+k,t:+t});else bad.push(l)});
good.sort((a,b)=>b.s-a.s||a.t-b.t);
let h="";
if(good.length){
const w=good[0],avg=(good.reduce((a,x)=>a+x.k,0)/good.length).toFixed(1),perf=good.filter(x=>x.k===12).length;
h+=`<div class="card"><b>Winner</b><div class="big">${esc(w.n)}</div><p>${w.s} points, ${w.k} of 12 correct, ${w.t} seconds</p></div>`;
h+=`<div class="card st"><div><b>${good.length}</b><span class="mut">valid players</span></div><div><b>${avg}</b><span class="mut">average correct</span></div><div><b>${perf}</b><span class="mut">perfect scores</span></div></div>`;
h+=`<div class="card tw"><table><tr><th>Rank</th><th>Player</th><th>Score</th><th>Correct</th><th>Seconds</th></tr>${good.map((x,i)=>`<tr class="${i<3?"top":""}"><td>${i+1}</td><td>${esc(x.n)}</td><td>${x.s}</td><td>${x.k}</td><td>${x.t}</td></tr>`).join("")}</table></div>`}
else h+=`<p class="mut">No valid codes yet.</p>`;
if(bad.length)h+=`<div class="card"><b>Not accepted (${bad.length})</b><p class="mut">These lines failed the check. Look for typos or edited values.</p>${bad.map(l=>`<div class="bad">${esc(l)}</div>`).join("")}</div>`;
$("#out").innerHTML=h}
$("#go").onclick=run;
$("#cl").onclick=()=>{$("#in").value="";try{localStorage.removeItem("m6codes")}catch(e){}$("#out").innerHTML=""};
async function poll(){try{const r=await fetch(SB_URL+"/rest/v1/scores?select=result_code&limit=1000",{headers:sbh()});if(r.ok){LIVE=(await r.json()).map(x=>x.result_code).join("\n");run();$("#st").textContent="Live, last update "+new Date().toLocaleTimeString()}else $("#st").textContent="Could not read scores (error "+r.status+")"}catch(e){$("#st").textContent="No connection"}}
if(SB_URL){poll();setInterval(poll,5000)}
try{const s=localStorage.getItem("m6codes");if(s){$("#in").value=s;run()}}catch(e){}
</script></body></html>
